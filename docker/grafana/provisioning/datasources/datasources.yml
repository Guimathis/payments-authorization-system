apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      httpMethod: GET
      derivedFields:
        - name: "Message log TraceID"
          datasourceUid: tempo
          matcherRegex: "(?:trace_id=|traceId=|\"traceId\":\\s*\")([a-f0-9]{32})"
          url: '$${__value.raw}'
        - name: "Label log TraceID"
          datasourceUid: tempo
          matcherType: label
          matcherRegex: trace_id
          url: '$${__value.raw}'

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: true
    jsonData:
      httpMethod: GET
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: service.name
            value: application
        queries:
          - name: Throughput
            query: 'sum(rate(http_server_requests_seconds_count{application=~"$${__tags}"}[1m]))'
      serviceMap:
        datasourceUid: prometheus
      search:
        hide: false
      nodeGraph:
        enabled: true
