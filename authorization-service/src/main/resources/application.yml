server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: authorization-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payments_auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    template:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  cloud:
    openfeign:
      micrometer:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 800
            read-timeout: 800
            logger-level: basic

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0 # Rastreia 100% das requisições
  otlp:
    logging:
      endpoint:  ${MANAGEMENT_OTLP_LOGGING_ENDPOINT:http://localhost:4318/v1/logs}
    tracing:
      # Endpoint HTTP OTLP do Grafana Tempo ou Jaeger
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
app:
  kafka:
    topics:
      transacao-autorizada: transacao-autorizada
    producer:
      send-timeout-ms: 3000
  outbox:
    scheduler:
      enabled: true
    polling-interval-ms: 1000
    batch-size: 50

antifraud:
  service:
    url: ${ANTIFRAUD_SERVICE_URL:http://localhost:8082}

resilience4j:
  circuitbreaker:
    instances:
      antifraud:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - feign.FeignException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
  retry:
    instances:
      antifraud:
        max-attempts: 2
        wait-duration: 200ms
        retry-exceptions:
          - feign.RetryableException
          - java.io.IOException
  timelimiter:
    instances:
      antifraud:
        timeout-duration: 800ms

springdoc:
  api-docs:
    path: /authorization-service/v3/api/docs
  override-server-url: true

logging:
  level:
    root: INFO
    com.payments.authorization: DEBUG
    org.springframework.web: INFO
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"