server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: ledger-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payments_ledger_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
    consumer:
      group-id: ledger-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.payments.ledger.event.PaymentAuthorizedEvent
        spring.json.use.type.headers: false

app:
  kafka:
    topics:
      transacao-autorizada: transacao-autorizada
    consumer:
      backoff:
        initial-interval-ms: 1000
        multiplier: 2.0
        max-interval-ms: 4000
        max-retries: 3
  ledger:
    strict-balance-check: ${STRICT_BALANCE_CHECK:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0 # Rastreia 100% das requisições
  otlp:
    tracing:
      # Endpoint HTTP OTLP do Grafana Tempo ou Jaeger
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /ledger-service/v3/api/docs
  override-server-url: true

logging:
  level:
    root: INFO
    com.payments.ledger: DEBUG
    org.springframework.web: INFO
