server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:ledger_testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    admin:
      auto-create: false
      fail-fast: false
    listener:
      auto-startup: false

app:
  kafka:
    topics:
      transacao-autorizada: transacao-autorizada
    consumer:
      backoff:
        initial-interval-ms: 50
        multiplier: 2.0
        max-interval-ms: 200
        max-retries: 3
  ledger:
    strict-balance-check: false
