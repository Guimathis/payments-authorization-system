services:
  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_DB: payments_auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments_auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payments-net

  antifraud-service:
    build:
      context: ./antifraud-service
      dockerfile: Dockerfile
    container_name: antifraud-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
    networks:
      - payments-net

  authorization-service:
    build:
      context: ./authorization-service
      dockerfile: Dockerfile
    container_name: authorization-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/payments_auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      ANTIFRAUD_SERVICE_URL: http://antifraud-service:8082
    depends_on:
      postgres-auth:
        condition: service_healthy
      antifraud-service:
        condition: service_started
    networks:
      - payments-net

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      AUTHORIZATION_SERVICE_URL: http://authorization-service:8081
      ANTIFRAUD_SERVICE_URL: http://antifraud-service:8082
    depends_on:
      - authorization-service
    networks:
      - payments-net

networks:
  payments-net:
    driver: bridge

volumes:
  postgres_auth_data:
