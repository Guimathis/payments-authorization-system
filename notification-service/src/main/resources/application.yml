server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: notification-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.payments.notification.event.PaymentAuthorizedEvent
        spring.json.use.type.headers: false

app:
  kafka:
    topics:
      transacao-autorizada: transacao-autorizada

logging:
  level:
    root: INFO
    com.payments.notification: DEBUG
    org.springframework.web: INFO
